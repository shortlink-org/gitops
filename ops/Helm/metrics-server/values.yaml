metrics-server:
  enabled: true

  # Pod network → node:10250 often fails on Talos/Cilium; hostNetwork fixes kubelet scrape.
  # With hostNetwork, secure-port must not be 10250 (kubelet uses that on the host).
  hostNetwork:
    enabled: true
  containerPort: 4443
  # RollingUpdate schedules a second pod before the old one exits → host port clash on single-node.
  updateStrategy:
    type: Recreate

  defaultArgs:
    - --secure-port=4443
    - --cert-dir=/tmp
    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
    - --metric-resolution=60s
    - --kubelet-request-timeout=45s
    - --kubelet-certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

  # /readyz calls SubjectAccessReview; default probe timeout 1s loses to slow/misconfigured webhooks.
  readinessProbe:
    httpGet:
      path: /readyz
      port: https
      scheme: HTTPS
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 5
    timeoutSeconds: 10
  livenessProbe:
    httpGet:
      path: /livez
      port: https
      scheme: HTTPS
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 5
    timeoutSeconds: 10

  metrics:
    enabled: true

  serviceMonitor:
    enabled: true

    scheme: https

    labels:
      release: prometheus-operator

    tlsConfig:
      insecureSkipVerify: true
