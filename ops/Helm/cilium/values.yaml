cilium:
  enabled: true

  # Schedules earlier under node CPU pressure or CNI churn (e.g. alongside metrics-server).
  priorityClassName: system-node-critical

  kubeProxyReplacement: true
  k8sServiceHost: 127.0.0.1
  k8sServicePort: 7445

  routingMode: tunnel
  tunnelProtocol: geneve

  hostFirewall:
    enabled: false

  cni:
    # Without it, Cilium will delete the Istio-CNI files that sidecars (or ztunnel) need, breaking pod networking.
    exclusive: false

  # Kubernetes client watch/list throttle: higher QPS reduces agent backlog under pod churn (kube-proxy-free).
  k8sClientRateLimit:
    qps: 50
    burst: 100

  # Agent API limiter for CNI ADD (PUT /endpoint/{id}). Defaults (~0.5/s) often return 429 under churn;
  # max-wait-duration lets requests wait longer in the queue. https://docs.cilium.io/en/stable/configuration/api-rate-limiting/
  apiRateLimit: "endpoint-create=rate-limit:4/s,rate-burst:24,parallel-requests:12,max-wait-duration:60s,auto-adjust:true"

  # Roll out cilium agent pods automatically when ConfigMap is updated.
  rollOutCiliumPods: true

  bpf:
    masquerade: true

  # LB IPAM + L2 announcements on the same IP as the node conflict; disabled for single public IP.
  l2announcements:
    enabled: false

  socketLB:
    enabled: true
    hostNamespaceOnly: true

  ipam:
    mode: kubernetes

  # Shards endpoint state into CiliumEndpointSlice CRs (less apiserver churn than one CiliumEndpoint per identity).
  ciliumEndpointSlice:
    enabled: true

  gatewayAPI:
    enabled: false
    # Talos / kube-proxy-free friendly defaults when Gateway API is enabled later.
    enableAlpn: true
    enableAppProtocol: true
    # Cilium Gateway hostNetwork touches the node stack; on some VPS/Talos setups it breaks 6443/50000 after the agent starts.
    # Ingress is via Istio Gateway; Cilium Gateway hostNetwork is not required here.
    hostNetwork:
      enabled: false

  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_BIND_SERVICE
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  cgroup:
    autoMount:
        enabled: false
    hostRoot: "/sys/fs/cgroup"

  prometheus:
    enabled: true

    serviceMonitor:
      enabled: true

      labels:
        release: prometheus-operator

  operator:
    replicas: 1

    priorityClassName: system-cluster-critical

    rollOutPods: true

    dashboards:
      enabled: true

      annotations:
        grafana_dashboard_folder: Cilium

    prometheus:
      enabled: true

    serviceMonitor:
      enabled: true

      labels:
        release: prometheus-operator

  envoy:
    serviceMonitor:
      enabled: true

      labels:
        release: prometheus-operator

  dashboards:
    enabled: true

    annotations:
      grafana_dashboard_folder: Cilium

  hubble:
    enabled: true

    # method=helm uses Helm lookup() against the API during install/upgrade; it fails if :6443 is slow or unreachable.
    # cronJob generates certs in-cluster (cilium-certgen Job) and does not need a live API during template render.
    tls:
      auto:
        method: cronJob

    listenAddress: ":4244"

    dropEventEmitter:
      enabled: true

    metrics:
      port: 9965
    
      enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - flow
        - icmp
        - http

      enableOpenMetrics: true

      dashboards:
        enabled: true

        annotations:
          grafana_dashboard_folder: Cilium

      serviceMonitor:
        enabled: true

        labels:
          release: prometheus-operator

    relay:
      enabled: true
      rollOutPods: true

    ui:
      enabled: true
      rollOutPods: true
