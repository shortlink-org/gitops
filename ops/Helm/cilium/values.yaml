cilium:
  enabled: true

  kubeProxyReplacement: true
  k8sServiceHost: localhost
  k8sServicePort: 7445

  #routingMode: tunnel
  #tunnelProtocol: geneve

  hostFirewall:
    enabled: false

  cni:
    # Without it, Cilium will delete the Istio-CNI files that sidecars (or ztunnel) need, breaking pod networking.
    exclusive: false

  # Increase rate limit when doing L2 announcements
  # k8sClientRateLimit:
  #   qps: 50
  #   burst: 100

  # Roll out cilium agent pods automatically when ConfigMap is updated.
  rollOutCiliumPods: true

  bpf:
    masquerade: true

  # LB IPAM + L2 на том же IP, что и нода, даёт конфликт; при одном публичном IP не используем.
  l2announcements:
    enabled: false

  socketLB:
    enabled: true
    hostNamespaceOnly: true

  ipam:
    mode: kubernetes

  gatewayAPI:
    enabled: false
    # Рекомендации Talos для Gateway API вместе с kube-proxy-free
    enableAlpn: true
    enableAppProtocol: true
    # hostNetwork на Cilium Gateway трогает сетевой стек ноды; у части VPS/Talos ломает доступ к 6443/50000 после старта агента.
    # Внешний вход у вас через Istio Gateway — Cilium Gateway на hostNetwork не обязателен.
    hostNetwork:
      enabled: false

  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_BIND_SERVICE
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  cgroup:
    autoMount:
        enabled: false
    hostRoot: "/sys/fs/cgroup"

  prometheus:
    enabled: true

    serviceMonitor:
      enabled: true

      labels:
        release: prometheus-operator

  operator:
    replicas: 1

    rollOutPods: true

    dashboards:
      enabled: true

      annotations:
        grafana_dashboard_folder: Cilium

    prometheus:
      enabled: true

    serviceMonitor:
      enabled: true

      labels:
        release: prometheus-operator

  envoy:
    serviceMonitor:
      enabled: true

    labels:
      release: prometheus-operator

  dashboards:
    enabled: true

    annotations:
      grafana_dashboard_folder: Cilium

  hubble:
    enabled: true

    # method=helm uses Helm lookup() against the API during install/upgrade; it fails if :6443 is slow or unreachable.
    # cronJob generates certs in-cluster (cilium-certgen Job) and does not need a live API during template render.
    tls:
      auto:
        method: cronJob

    listenAddress: ":4244"

    dropEventEmitter:
      enabled: true

    metrics:
      enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - flow
        - icmp
        - http

      enableOpenMetrics: true

      dashboards:
        enabled: true

        annotations:
          grafana_dashboard_folder: Cilium

      serviceMonitor:
        enabled: true

        labels:
          release: prometheus-operator

    relay:
      enabled: true
      rollOutPods: true

    ui:
      enabled: true
      rollOutPods: true
