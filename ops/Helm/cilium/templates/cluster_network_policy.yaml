{{- $hf := .Values.cilium.hostFirewall | default dict }}
{{- if $hf.enabled }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-lockdown
spec:
  nodeSelector: {}

  ingress:
    # Talos API
    - toPorts:
        - ports:
            - port: "50000"
              protocol: TCP

    # Kubernetes API
    - toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Gateway / ingress (hostNetwork)
    - toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP

  egress:
    - toEntities:
        - all
{{- end }}