services:

  nginx:
    depends_on:
      - default_backend
    image: nginx:1.31-alpine-otel
    container_name: nginx
    init: true
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://grafana-tempo.grafana:4317}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - simple
    dns:
      - ${DNS_IP}
    dns_search: ${DNS_SEARCH}
    volumes:
      - ./ops/docker-compose/gateway/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./ops/docker-compose/gateway/nginx/conf/conf.d:/etc/nginx/conf.d
      - ./ops/docker-compose/gateway/nginx/conf/templates:/etc/nginx/templates

  default_backend:
    image: nginx:1.31-alpine
    container_name: default_backend
    init: true
    networks:
      - simple
    dns:
      - ${DNS_IP}
    dns_search: ${DNS_SEARCH}
