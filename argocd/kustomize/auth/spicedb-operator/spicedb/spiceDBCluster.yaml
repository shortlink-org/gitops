apiVersion: authzed.com/v1alpha1
kind: SpiceDBCluster
metadata:
  name: shortlink
  annotations:
    # After shared PostgresCluster (wave 1): needs shortlink-postgres-pguser-spicedb secret.
    argocd.argoproj.io/sync-wave: "2"
spec:
  config:
    replicas: 1
    datastoreEngine: postgres
    image: ghcr.io/authzed/spicedb:v1.51.0
  secretName: shortlink-spicedb-config
  patches:
    - kind: Deployment
      patch:
        spec:
          template:
            metadata:
              annotations:
                sidecar.istio.io/inject: "false"
            spec:
              containers:
                - name: spicedb
                  resources:
                    requests:
                      memory: "128Mi"
                      cpu: "50m"
                    limits:
                      memory: "512Mi"
                      cpu: "200m"

                  # FIX: make probes less aggressive, avoid startup connection refused
                  readinessProbe:
                    exec:
                      command:
                        - grpc_health_probe
                        - -v
                        - -addr=localhost:50051
                    initialDelaySeconds: 15
                    timeoutSeconds: 5
                    periodSeconds: 10
                    successThreshold: 1
                    failureThreshold: 6

                  livenessProbe:
                    exec:
                      command:
                        - grpc_health_probe
                        - -v
                        - -addr=localhost:50051
                    initialDelaySeconds: 90
                    timeoutSeconds: 5
                    periodSeconds: 10
                    successThreshold: 1
                    failureThreshold: 5

                  env:
                    - name: SPICEDB_DATASTORE_CONN_URI
                      valueFrom:
                        secretKeyRef:
                          name: shortlink-postgres-pguser-spicedb
                          key: uri

                    - name: SPICEDB_DISPATCH_CACHE_METRICS
                      value: "true"
                    - name: SPICEDB_DISPATCH_CLUSTER_METRICS
                      value: "true"
                    - name: SPICEDB_NS_CACHE_METRICS
                      value: "true"
                    - name: SPICEDB_METRICS_ENABLED
                      value: "true"

                    - name: SPICEDB_OTEL_PROVIDER
                      value: otlpgrpc
                    - name: SPICEDB_OTEL_SAMPLE_RATIO
                      value: "1"
                    - name: OTEL_EXPORTER_OTLP_ENDPOINT
                      value: "http://grafana-tempo.grafana:4317"

    - kind: Job
      patch:
        spec:
          template:
            metadata:
              annotations:
                sidecar.istio.io/inject: "false"
            spec:
              containers:
                - name: migrate
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "25m"
                    limits:
                      memory: "256Mi"
                      cpu: "100m"
                  env:
                    - name: SPICEDB_DATASTORE_CONN_URI
                      valueFrom:
                        secretKeyRef:
                          name: shortlink-postgres-pguser-spicedb
                          key: uri
