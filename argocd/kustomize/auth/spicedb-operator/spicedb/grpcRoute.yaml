apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: spicedb-grpc
  annotations:
    # After SpiceDBCluster (wave 2): backendRefs target the cluster Service.
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      namespace: istio-ingress
      sectionName: grpc

  rules:
    - matches:
        - method:
            service: authzed.api.v1.SchemaService
        - method:
            service: authzed.api.v1.PermissionsService
        - method:
            service: authzed.api.v1.WatchService
        - method:
            service: authzed.api.v1.ExperimentalService
      backendRefs:
        - name: shortlink
          port: 50051
